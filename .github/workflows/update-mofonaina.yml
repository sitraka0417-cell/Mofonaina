name: Update Mofonaina

on:
  schedule:
    - cron: "0 3 * * *"      # isan'andro amin'ny 03:00 UTC (06:00 ora Madagasikara)
  workflow_dispatch:          # azo alefa amin'ny tanana koa

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Maka ny donné avy amin'ny API ary manova azy
        run: python .github/scripts/convert_fiambenana.py --out .
        # raha mila token: env: API_TOKEN: ${{ secrets.API_TOKEN }}

      - name: Commit raha misy fiovana
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '[0-3][0-9]_[0-1][0-9]_[0-9][0-9][0-9][0-9].txt'
          if git diff --cached --quiet; then
            echo "Tsy misy fiovana."
          else
            git commit -m "Fanavaozana mofonaina ($(date -u +%F))"
            git push
          fi
